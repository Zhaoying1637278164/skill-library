function guidePage(){return `<section class="guide-hero"><span>新手指南</span><h1>技能不是点一下就运行的软件，<br>而是交给 AI 助手的工作说明。</h1><p>这里帮你找到合适的技能、看懂它能做什么、下载原始资料。真正干活，要在支持插件或技能的 AI 工具里加载它。</p></section><section class="section"><div class="section-head"><h2>先认识三样东西</h2></div><div class="guide-cards">${[['技能','SKILL.md 是一份给 AI 看的操作说明：什么时候用、按什么步骤做、交付什么。','file-text','数据、数据库与BI'],['插件包','保存技能、脚本、参考资料与连接配置的 ZIP；解压时保留原目录结构。','package','财务与投资'],['服务连接','让 AI 访问外部服务的配置；通常需要账号或授权，具体要求见原文。','plug','AI与智能体']].map(([h,p,i,c])=>`<div class="guide-card"><span class="app-icon" style="${tone(c)}">${icon(i)}</span><h3>${h}</h3><p>${p}</p></div>`).join('')}</div></section><section class="section"><div class="section-head"><h2>四步上手</h2></div><div class="steps">${[['找到你的工作任务','搜索银行流水、Excel 或文档整理，也可以按领域和场景浏览。'],['看用途与准备材料','打开详情，确认输入、适配平台、依赖和服务要求。'],['下载并加载完整包','解压保留结构，按 README 在兼容的 AI 工具里加载，配置所需连接。'],['用小样本检查结果','复制中文问法并替换信息，核对输出和来源，再用于完整任务。']].map(([h,p],i)=>`<div class="step"><span class="number">${i+1}</span><h3>${h}</h3><p>${p}</p></div>`).join('')}</div></section><section class="section"><div class="section-head"><h2>常见问题</h2></div><div class="faq">${[['下载后能直接运行吗？','本站仅静态整理包内说明，未安装或执行包内程序。请按包内 README 和 SKILL.md 检查环境与安装方法。'],['为什么技能名称和原文仍然是英文？','保留作者的原始名称、路径、命令和字段，方便 AI 找到对应资料。中文摘要用于导航，具体支持范围以原文为准。'],['只下载一个 SKILL.md 可以吗？','有些技能会引用脚本、模板和参考资料。建议先下载完整包，保留目录结构，避免缺失依赖。'],['一个包为什么出现在多个分类？','分类按领域、场景和任务组织；一个工具可能支持多个用途。列表按相同 ZIP 的 SHA-256 去重，分类数量不可相加作为总数。'],['原文和下载文件会被改写吗？','原始 ZIP 和单个文件保留原字节。下载前核验 ZIP 的 SHA-256；HTML 和 SVG 原文只作为文本阅读。'],['中文内容是否都已经完成？','部分技能尚未翻译时显示作者原始用途说明，点击可阅读完整原文。目录记录 '+S.total+' 个包，按原字节去重后 '+R.length+' 个。']].map(([q,a])=>`<details><summary>${q}</summary><p>${a}</p></details>`).join('')}</div></section><div class="guide-cta"><div><h2>从一项真实工作开始</h2><p>先看看你的工作场景，再选择合适的工具。</p></div><a class="btn primary" href="${catHref('财务与投资','月结与对账')}">浏览月结与对账${icon('chevron-right')}</a></div>`}

function syncFrameHeight(){
 if(window.parent===window)return;
 let lastHeight=0,pending=false;
 const report=()=>{pending=false;const height=Math.ceil(document.body.getBoundingClientRect().height);if(height>0&&height!==lastHeight){lastHeight=height;window.parent.postMessage({isStreamlitMessage:true,type:'streamlit:setFrameHeight',height},'*')}};

// Read archive files as data; never execute their contents.
const zipCache=new Map();let viewBytes=null,viewRecord=null,viewFile='',viewText='',readerFormat='formatted',viewVersion=0;
const TEXT_EXT=/\.(md|txt|json|jsonl|csv|tsv|yaml|yml|toml|ini|cfg|conf|py|js|jsx|ts|tsx|html|css|sql|sh|bash|zsh|xml|svg|rst|log|go|rs|java|c|h|cpp|r|rb|ps1|ipynb|env)$/i;
async function zipBytes(r){
 if(!r.asset_url)throw Error('此原包暂不可下载。');
 if(zipCache.has(r.asset_sha256))return zipCache.get(r.asset_sha256);
 const response=await fetch(r.asset_url);if(!response.ok)throw Error('原包请求失败（'+response.status+'）。');
 const bytes=new Uint8Array(await response.arrayBuffer());
 const sha=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes))).map(v=>v.toString(16).padStart(2,'0')).join('');
 if(sha!==r.asset_sha256)throw Error('原包校验不通过，请刷新后重试。');
 let sum=bytes.length;for(const b of zipCache.values())sum+=b.length;
 if(sum>64*1048576)zipCache.clear();zipCache.set(sha,bytes);return bytes;
}
async function memberBytes(r,path){
 const info=r.members?.find(m=>m.path===path);if(!info)throw Error('未找到原始文件。');
 if(info.size>50*1048576)throw Error('此文件超过 50 MB，请下载完整 ZIP。');
 const data=fflate.unzipSync(await zipBytes(r),{filter:m=>m.name===path});
 if(!Object.prototype.hasOwnProperty.call(data,path))throw Error('原包中未找到此路径。');
 if(data[path].length!==info.size)throw Error('原始文件大小校验失败。');return data[path];
}
function decodeOriginal(bytes){
 if(bytes[0]===255&&bytes[1]===254)return new TextDecoder('utf-16le').decode(bytes);
 if(bytes[0]===254&&bytes[1]===255)return new TextDecoder('utf-16be').decode(bytes);
 try{return new TextDecoder('utf-8',{fatal:true}).decode(bytes)}catch{return new TextDecoder('gb18030').decode(bytes)}
}
function downloadBytes(bytes,name){const url=URL.createObjectURL(new Blob([bytes],{type:'application/octet-stream'}));const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)}
async function runDownload(button,r,path){const text=button.innerHTML;button.disabled=true;button.textContent='正在准备…';try{downloadBytes(path?await memberBytes(r,path):await zipBytes(r),path?path.split('/').pop():r.file)}catch(e){feedback(e.message)}finally{button.innerHTML=text;button.disabled=false}}
function readerPage(r,path){const size=r.members?.find(m=>m.path===path)?.size;const dirs=new Map();for(const p of r.paths){const dir=p.includes('/')?p.slice(0,p.lastIndexOf('/'))+'/':'';if(!dirs.has(dir))dirs.set(dir,[]);dirs.get(dir).push(p)}const group=([dir,paths])=>`${dir?`<span class="file-folder">${esc(dir)}</span>`:''}${paths.map(p=>`<a class="tree-file ${p===path?'active':''}" href="${fileHref(r,p)}" title="${esc(p)}">${icon('file-text')}<span>${esc(p.split('/').pop())}</span></a>`).join('')}`;const s=r.skills.find(s=>s.path===path);return `<header class="reader-head"><a class="reader-back" href="${pkgHref(r)}">${icon('chevron-left')}${esc(title(r))}</a><code class="reader-path">${esc(path)}</code><span class="small reader-size">${size===undefined?'':bytesLabel(size)}</span><div class="reader-actions"><div class="mode-toggle" role="group" aria-label="显示方式"><button data-mode="formatted" class="active">排版</button><button data-mode="source">源码</button></div><button class="btn" id="downloadFile">${icon('download')}下载此文件</button><button class="btn primary" data-zip="${r.id}">下载完整包</button></div></header><div class="reader-layout"><nav class="file-tree" aria-label="包内文件"><p class="small">${r.paths.length} 个文件</p><input id="fileFilter" aria-label="搜索包内文件" placeholder="搜索文件名"><div id="treeFiles">${[...dirs].map(group).join('')}</div></nav><div class="mobile-file-select"><label for="fileSelect">选择文件</label><select id="fileSelect">${r.paths.map(p=>`<option value="${esc(p)}" ${p===path?'selected':''}>${esc(p)}</option>`).join('')}</select></div><article class="reader-content">${s?.description_zh?`<div class="reader-guide"><strong>中文导读</strong><p>${esc(s.description_zh)}</p></div>`:''}<p id="readerStatus" class="small" role="status">正在读取完整原文…</p><div id="formattedText" class="markdown"></div><pre id="sourceText" hidden></pre><p class="reader-copyright">原文版权归原作者 · ${esc(license(r))}</p></article></div>`}
function sanitizeMarkdown(html){const t=document.createElement('template');t.innerHTML=html;t.content.querySelectorAll('script,style,iframe,object,embed,form,input,button,svg,math,link,meta,base,audio,video,img').forEach(n=>n.remove());for(const n of t.content.querySelectorAll('*')){for(const a of [...n.attributes]){if(!['href','title','colspan','rowspan'].includes(a.name))n.removeAttribute(a.name)}if(n.tagName==='A'){const href=n.getAttribute('href')||'';if(!safeUrl(href)&&!href.startsWith('#'))n.removeAttribute('href');else{n.setAttribute('target','_blank');n.setAttribute('rel','noopener noreferrer')}}}return t.innerHTML}
function formattedMarkdown(text){let body=text,meta='';if(text.startsWith('---\n')||text.startsWith('---\r\n')){const m=text.match(/^---\r?\n([\s\S]*?)\r?\n---(?:\r?\n|$)/);if(m){const rows=m[1].split('\n').filter(x=>/^(name|description):/.test(x));meta='<div class="frontmatter">'+rows.map(line=>{const k=line.slice(0,line.indexOf(':')),v=line.slice(line.indexOf(':')+1).trim().replace(/^['"]|['"]$/g,'');return `<div><span>${k==='name'?'名称':'用途原文'}</span><p>${esc(v)}</p></div>`}).join('')+'</div>';body=text.slice(m[0].length)}}return meta+sanitizeMarkdown(marked.parse(body,{gfm:true,breaks:false}))}
function updateReader(){if(!$('sourceText'))return;const md=/\.(md|markdown|rst)$/i.test(viewFile);const formatted=readerFormat==='formatted'&&md;$('sourceText').textContent=viewText;$('sourceText').hidden=formatted;$('formattedText').hidden=!formatted;if(formatted)$('formattedText').innerHTML=formattedMarkdown(viewText);document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===readerFormat));}
async function readCurrentFile(r,path,routeId){const v=++viewVersion;viewRecord=r;viewFile=path;viewText='';viewBytes=null;readerFormat='formatted';$('downloadFile').disabled=true;try{const info=r.members?.find(m=>m.path===path);if(!info)throw Error('包内没有这个文件');if(info.size>5*1048576){$('readerStatus').textContent='此文件大于 5 MB，请下载原文件阅读。';$('downloadFile').disabled=false;return}const bytes=await memberBytes(r,path);if(v!==viewVersion||routeId!==routeVersion)return;viewBytes=bytes;const text=decodeOriginal(bytes);const isText=TEXT_EXT.test(path)||(!bytes.subarray(0,4096).includes(0)&&!/[\u0000-\u0008]/.test(text.slice(0,4096)));$('downloadFile').disabled=false;if(!isText){$('readerStatus').textContent='二进制文件 · '+bytesLabel(bytes.length)+' · 可下载原文件';return}viewText=text;$('readerStatus').textContent='完整原文 · '+text.split('\n').length+' 行 · '+bytesLabel(bytes.length)+(/\.(html|svg)$/i.test(path)?' · 仅以纯文本显示':'');updateReader()}catch(e){if(v===viewVersion&&routeId===routeVersion)$('readerStatus').textContent='读取失败：'+e.message}}
function bindReader(){document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{readerFormat=b.dataset.mode;updateReader()});$('downloadFile').onclick=()=>viewBytes?downloadBytes(viewBytes,viewFile.split('/').pop()):runDownload($('downloadFile'),selected,viewFile);$('fileSelect').onchange=()=>location.hash=fileHref(selected,$('fileSelect').value);$('fileFilter').oninput=()=>{const q=$('fileFilter').value.toLowerCase();document.querySelectorAll('.tree-file').forEach(a=>a.hidden=!a.title.toLowerCase().includes(q));document.querySelectorAll('.file-folder').forEach(n=>n.hidden=!!q)}}
